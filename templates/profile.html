{% extends "base.html" %}

{% block content %}

<div class="dashboard">

    <h1>👤 My Profile</h1>

    <div class="card">

        <h2>🆔 User ID</h2>
        <p>{{ user[0] }}</p>

        <h2>👤 Username</h2>
        <p>{{ user[1] }}</p>

        <h2>📅 Registration Date</h2>
        <p>{{ user[2] }}</p>

        {% if user[3] %}

       <img
       src="/uploads/{{ user[3] }}"
       width="150"
       height="150"
       style="border-radius:50%;">

      {% else %}

      <img
      src="https://via.placeholder.com/150"
      width="150"
      height="150"
      style="border-radius:50%;">

{% endif %}

<form action="/profile/upload"
      method="POST"
      enctype="multipart/form-data">

    <input
        type="file"
        name="photo"
        accept="image/*"
        required>

    <br><br>

    <button type="submit">
        📤 Upload Photo
    </button>

    <br><br>

    <a href="/edit-profile">
    <button type="button">
        ✏️ Edit Profile
    </button>
   </a>
   
   <br><br>
   <a href="/change-password">
    <button type="button">
        🔒 Change Password
    </button>
   </a>

   <br><br>
   <a href="/change-password">
   <button type="button">
         Forgot Password
    </button>
   </a>

</form>

    </div>

</div>

{% endblock %}
