{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>🔒 Change Password</h1>

    <form method="POST">

        <label>Current Password</label>

        <input
            type="password"
            name="current_password"
            required>

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            required>

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            required>

        <br><br>

        <button type="submit">
            🔒 Change Password
        </button>

    </form>

</div>

{% endblock %}
