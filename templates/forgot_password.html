{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>🔑 Forgot Password</h1>

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required>

        <label>New Password</label>
        <input
            type="password"
            name="new_password"
            required>

        <label>Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            required>

        <br><br>

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

{% endblock %}
