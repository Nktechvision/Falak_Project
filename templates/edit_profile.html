{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>✏️ Edit Profile</h1>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            value="{{ user[0] }}"
            required>

        <br><br>

        <button type="submit">
            💾 Save Changes
        </button>

    </form>

</div>

{% endblock %}
